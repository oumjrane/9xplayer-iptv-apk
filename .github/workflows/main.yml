name: Build 9XPlayer Android & TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Android Platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure Android TV & Cleartext Traffic Manifest
        run: |
          cp -f android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: 9XPlayer-IPTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
